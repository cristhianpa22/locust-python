services:
  load-balancer: 
    image: nginx:latest
    container_name: nginx-balanceador
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
  api-backend:
    build:
      context: .
    expose:
      - "5000"
    deploy:
      replicas: 3 
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
  
  